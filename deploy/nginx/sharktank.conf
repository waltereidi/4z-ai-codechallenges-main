# ==============================================================================
# SharkTank - Configuração do Nginx (HTTP -> HTTPS Redirection + Proxy Reverso)
# Porta 80: Redireciona tudo para HTTPS (301) + Desafio ACME Certbot
# Porta 443: SSL/TLS + Proxy Reverso para Node/React em 127.0.0.1:5173
# ==============================================================================

# ------------------------------------------------------------------
# Bloco HTTP (porta 80)
# ------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Diretório para validação ACME do Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Redirecionamento permanente para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------
# Bloco HTTPS (porta 443)
# ------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # Certificados SSL (Let's Encrypt ou Autoassinado)
    # Let's Encrypt (com domínio):
    # ssl_certificate     /etc/letsencrypt/live/SEU_DOMINIO/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO/privkey.pem;
    # Autoassinado (fallback sem domínio):
    ssl_certificate     /etc/ssl/sharktank/fullchain.pem;
    ssl_certificate_key /etc/ssl/sharktank/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cabeçalhos de Segurança
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Proxy Reverso para a Aplicação em 127.0.0.1:5173
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
