version: '3.8'

services:
  shark-tank-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shark-tank-exile
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - PORT=5173
      - NODE_ENV=production
      - DB_PATH=/app/data/shark_tank.db
    volumes:
      - sqlite_data:/app/data

volumes:
  sqlite_data:
    driver: local
